# Expected colours come from the same arithmetic as the shader, worked in
# double precision: hue_of, hue_mask, a YIQ hue turn, saturation about
# luminance, and a brightness scale, band by band in order. Every knob at
# zero is the picture as it came, to the tolerance.

[[probe]]
name = "default, a colour"
input = [0.4, 0.2, 0.1, 1]
expect = [0.4, 0.2, 0.1, 1]

[[probe]]
name = "default, a highlight past white"
input = [4, 1, 0.05, 1]
expect = [4, 1, 0.05, 1]

[[probe]]
name = "default, a grey"
input = [0.18, 0.18, 0.18, 1]
expect = [0.18, 0.18, 0.18, 1]

# Every band's hue, saturation and lightness at the bottom of its range.
[[probe]]
name = "minimum, a colour"
at = "min"
input = [0.4, 0.2, 0.1, 1]
expect = [0.126214, 0.126214, 0.126214, 1]

[[probe]]
name = "minimum, a green"
at = "min"
input = [0.1, 0.8, 0.1, 1]
expect = [0.290842, 0.290842, 0.290842, 1]

# And at the top.
[[probe]]
name = "maximum, a colour"
at = "max"
input = [0.4, 0.2, 0.1, 1]
expect = [2.89579, -0.634104, 6.92228, 1]

[[probe]]
name = "maximum, a green"
at = "max"
input = [0.1, 0.8, 0.1, 1]
expect = [-0.081257, 1.42718, -1.52653, 1]

# A band touches its own hues alone: the reds pulled grey leave a green as it was.
[[probe]]
name = "red saturation out, a green"
params = { red_sat = -100 }
input = [0.1, 0.8, 0.1, 1]
expect = [0.1, 0.8, 0.1, 1]

# A grey belongs to no band, so the strongest push on every band leaves it.
[[probe]]
name = "every band's saturation up, a grey"
params = { red_sat = 100, orange_sat = 100, yellow_sat = 100, green_sat = 100, cyan_sat = 100, blue_sat = 100, purple_sat = 100, magenta_sat = 100 }
input = [0.18, 0.18, 0.18, 1]
expect = [0.18, 0.18, 0.18, 1]

# The greens pulled to none turn a green to the grey of its own luminance.
[[probe]]
name = "green saturation out, a green"
params = { green_sat = -100 }
input = [0.1, 0.8, 0.1, 1]
expect = [0.60064, 0.60064, 0.60064, 1]

# The blues turned leave an orange alone.
[[probe]]
name = "blue hue turned, an orange"
params = { blue_hue = 100 }
input = [0.4, 0.2, 0.1, 1]
expect = [0.4, 0.2, 0.1, 1]
