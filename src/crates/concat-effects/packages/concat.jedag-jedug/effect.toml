format = 2

[effect]
id = "concat.jedag-jedug"
name = "Jedag-Jedug Beat Zoom"
version = 2
kind = "effect"
category = "Move"
shelves = ["Featured"]
order = 15
intensity = "punch"
aliases = ["jedag-jedug", "beat-zoom"]
description = "Rhythmic CapCut-style bass zoom pump and radial RGB split synced to timeline beat tempo."

[[param]]
key = "punch"
label = "Bass Punch"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "bpm"
label = "Tempo"
min = 60
max = 200
default = 128
step = 1
unit = "BPM"

[wgsl]
entry = "effect.wgsl"
