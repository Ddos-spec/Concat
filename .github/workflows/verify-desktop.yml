          call({"method": "project.save", "path": proj})
          call({"method": "export.run", "path": proj, "output": export_mp4})
          proc.stdin.close()
          rest = proc.stdout.read()
          print(rest[-2000:])
          assert proc.wait(timeout=180) == 0
          assert os.path.isfile(export_mp4) and os.path.getsize(export_mp4) > 1000, "export missing or empty"
          print("WIN_EXPORT_BYTES:", os.path.getsize(export_mp4))
          '@ | python -
          & "$env:FFMPEG_DIR\bin\ffprobe.exe" -v error -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 out-win-test\win-export.mp4

