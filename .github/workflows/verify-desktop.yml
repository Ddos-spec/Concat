name: Verify desktop

# A quick Linux x86_64 build of the window and the CLI, run on a branch to
# see a change working before it is shipped: the quick profile (the window
# unoptimised), the scene-detect, colour and track commands on a clip made
# on the spot, and the window itself started under Xvfb and photographed.
# It publishes nothing. The shipping build is build-app.yml.

on:
  workflow_dispatch:
  push:
    branches: [verify/capcut-parity]

env:
  CARGO_TERM_COLOR: always
  ORT_VERSION: 1.28.0
  GGML_NATIVE: "OFF"
  GGML_BACKEND_DL: "ON"
  GGML_CPU_ALL_VARIANTS: "ON"

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The pinned toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' src/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (v1), 2026-10-09
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libgl1-mesa-dev \
            libgtk-3-dev libasound2-dev libclang-dev cmake libxkbcommon-x11-0 \
            xvfb xauth libgl1-mesa-dri mesa-vulkan-drivers imagemagick xdotool

      - name: FFmpeg development libraries
        run: |
          set -euo pipefail
          scripts/ci/fetch.sh "ffmpeg-linux64" ffmpeg.tar.xz
          mkdir -p ffmpeg-dev
          tar -xf ffmpeg.tar.xz -C ffmpeg-dev --strip-components=1
          {
            echo "FFMPEG_DIR=$PWD/ffmpeg-dev"
            echo "LD_LIBRARY_PATH=$PWD/ffmpeg-dev/lib"
            echo "RUSTFLAGS=-C link-arg=-Wl,-rpath,$PWD/ffmpeg-dev/lib -C link-arg=-Wl,--disable-new-dtags"
          } >> "$GITHUB_ENV"

      # microsoft/onnxruntime left GitHub, so the release archive scripts/ci
      # pins is gone. The shared library is the same one PyPI's manylinux
      # wheel carries; it is unpacked here and linked the way the pinned
      # archive was.
      - name: ONNX Runtime (from the PyPI wheel)
        run: |
          set -euo pipefail
          pip download "onnxruntime==$ORT_VERSION" --no-deps --only-binary=:all: \
            --platform manylinux_2_28_x86_64 --python-version 3.12 -d ort-wheel
          mkdir -p ort-lib ort-unpacked
          unzip -q ort-wheel/*.whl -d ort-unpacked
          lib=$(find ort-unpacked -name "libonnxruntime.so.$ORT_VERSION" | head -1)
          test -n "$lib"
          cp "$lib" ort-lib/
          ln -sf "libonnxruntime.so.$ORT_VERSION" ort-lib/libonnxruntime.so
          ln -sf "libonnxruntime.so.$ORT_VERSION" ort-lib/libonnxruntime.so.1
          ls -la ort-lib
          {
            echo "ORT_LIB_LOCATION=$PWD/ort-lib"
            echo "ORT_PREFER_DYNAMIC_LINK=1"
            echo "LD_LIBRARY_PATH=$PWD/ffmpeg-dev/lib:$PWD/ort-lib"
          } >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src
          key: verify-quick
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST GGML ORT

      - name: Build
        shell: bash
        working-directory: src
        run: |
          set -o pipefail
          cargo build --profile quick -p concat -p concat-cli 2>&1 | tee build.log

      - name: Build log to the summary (failure only)
        if: failure()
        shell: bash
        run: |
          if [ -f src/build.log ]; then
            { echo '### Build failed'; echo '```'; grep -E '^(error|warning: unused)' -A12 src/build.log | head -120; echo '```'; tail -30 src/build.log; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Tests of the new engine pieces
        shell: bash
        working-directory: src
        run: |
          mkdir -p ../out
          set +e
          cargo test --profile quick -p concat-vision -p concat-text -p concat-effects --lib > ../out/test.log 2>&1
          code=$?
          grep -E '^test result|^error' ../out/test.log
          if [ $code -ne 0 ]; then
            echo '--- the first panic that is not a poisoned lock, in full'
            python3 ../scripts/ci/first-panic.py ../out/test.log
          fi
          exit $code

      - name: The HSL package, run through the GPU
        shell: bash
        working-directory: src
        run: |
          set +e
          mkdir -p ../out
          # Every built-in package's probes through its shader on the GPU, which
          # here is Mesa's software Vulkan; the HSL package's are among them.
          CONCAT_REQUIRE_GPU=1 cargo test --profile quick -p concat-render --lib \
            every_package_probe_holds -- --nocapture > ../out/probes.log 2>&1
          code=$?
          cli=target/quick/concat-cli
          listed=$(echo '{"method":"catalogue.list","kind":"filter"}' | $cli api | python3 ../scripts/ci/find-effect.py concat.hsl)
          {
            echo '### Shader probes of every built-in package, on the GPU'
            echo "exit $code"
            echo '```'
            grep -E 'probes$|^test |test result|a software adapter|panicked|FAIL|expected|rendered|concat.hsl' ../out/probes.log | head -40
            echo '```'
            echo '### concat.hsl in the catalogue'
            echo '```'
            echo "$listed"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Scene, colour and track on a clip made here
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          ffmpeg() { "$PWD/ffmpeg-dev/bin/ffmpeg" "$@"; }
          ffmpeg -v error -y \
            -f lavfi -i "color=c=red:s=320x180:r=30:d=2" \
            -f lavfi -i "color=c=green:s=320x180:r=30:d=2" \
            -f lavfi -i "color=c=blue:s=320x180:r=30:d=2" \
            -filter_complex "[0][1][2]concat=n=3:v=1:a=0" out/shots.mp4
          ffmpeg -v error -y -f lavfi -i "testsrc2=s=320x180:r=30:d=3" \
            -vf "scale=640:360,crop=320:180:'t*60':90" out/moving.mp4
          cli=src/target/quick/concat-cli
          {
            echo "### New commands"
            echo '```'
            echo "scenes (expect 2.000 and 4.000):"; $cli scenes out/shots.mp4
            echo "colour at 1s:"; $cli colour out/shots.mp4 --at 1
            echo "colour at 3s:"; $cli colour out/shots.mp4 --at 3
            echo "track from the upper right:"; $cli track out/moving.mp4 --to 2 --x 0.9 --y 0.1 | sed -n 1,6p
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test "$($cli scenes out/shots.mp4 | tr '\n' ' ')" = "2.000 4.000 "

      - name: The window under Xvfb
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out stage/lib
          # whisper.cpp is built as shared libraries by whisper-rs-sys; the
          # shipping bundle carries them in lib/, here they are gathered.
          find src/target/quick/build -path '*whisper-rs-sys-*' \
            \( -name 'libwhisper.so*' -o -name 'libggml*.so*' \) -exec cp -a {} stage/lib/ \;
          ls stage/lib
          export LD_LIBRARY_PATH="$PWD/stage/lib:$LD_LIBRARY_PATH"
          src/target/quick/concat --version
          xvfb-run -a -s "-screen 0 1600x900x24" bash -c '
            src/target/quick/concat --smoke || echo "smoke exit $?"
            src/target/quick/concat > out/window.log 2>&1 &
            pid=$!
            sleep 25
            import -window root out/window.png || true
            kill $pid 2>/dev/null || true
          '
          ls -la out

      - name: The editor on a project made here
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/stage/lib:$LD_LIBRARY_PATH"
          here="$PWD"
          rm -rf "$here/out/demo"
          python3 scripts/ci/make-demo-project.py "$here/src/target/quick/concat-cli" \
            "$here/out" "$here/out/shots.mp4" "$here/out/moving.mp4" | tee out/api.log | cut -c1-200
          bash scripts/ci/drive-editor.sh "$here/src/target/quick/concat" \
            "$here/out/demo" "$here/out"
          {
            echo "### The clip menus, used in the window"
            echo '```'
            cat out/drive-steps.log out/project-summary.txt 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ls -la out

      - name: HSL on a real frame, through the compositor
        shell: bash
        run: |
          set +e
          export LD_LIBRARY_PATH="$PWD/stage/lib:$LD_LIBRARY_PATH"
          rm -rf out/hslproj
          report=$(python3 scripts/ci/hsl-render.py "$PWD/src/target/quick/concat-cli" "$PWD/out" "$PWD/out/shots.mp4" 2>&1)
          code=$?
          { echo '### HSL on a real frame'; echo '```'; echo "$report"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Whisper, downloaded by the app's own code and run here
        shell: bash
        working-directory: src
        run: |
          set +e
          sudo apt-get install -y espeak-ng > /dev/null
          # The speech crate links sherpa-onnx's prebuilt static library, as ci.yml has it.
          version=$(grep -A1 'name = "sherpa-onnx-sys"' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          stem="sherpa-onnx-v$version-linux-x64-static-lib"
          ( cd .. && scripts/ci/fetch.sh sherpa-onnx-linux-x64-static-lib sherpa.tar.bz2 && mkdir -p sherpa && tar -xjf sherpa.tar.bz2 -C sherpa )
          export SHERPA_ONNX_LIB_DIR="$PWD/../sherpa/$stem/lib"
          ls "$SHERPA_ONNX_LIB_DIR" | head -3
          mkdir -p ../out
          espeak-ng -v en-us -s 130 -w ../out/speech.wav "Hello world. This is a test of the local transcriber."
          export LD_LIBRARY_PATH="$PWD/../stage/lib:$LD_LIBRARY_PATH"
          CONCAT_TRANSCRIBE_AUDIO="$PWD/../out/speech.wav" CONCAT_EXPECT_WORDS="hello,world,test,transcrib" \
            cargo test --profile quick -p concat-speech --lib -- --ignored downloads_the_model_and_hears_the_words --nocapture > ../out/whisper.log 2>&1
          code=$?
          {
            echo '### Local speech to text: model downloaded, then whisper.cpp in this process'
            echo "exit $code"
            echo '```'
            grep -E 'heard:|downloaded [0-9]+ MB|test result|panicked|none of|^[0-9]+\.[0-9]+-' ../out/whisper.log | head -20
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Kokoro speaks, whisper listens (both models, both local)
        shell: bash
        working-directory: src
        run: |
          set +e
          version=$(grep -A1 'name = "sherpa-onnx-sys"' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          export SHERPA_ONNX_LIB_DIR="$PWD/../sherpa/sherpa-onnx-v$version-linux-x64-static-lib/lib"
          export LD_LIBRARY_PATH="$PWD/../stage/lib:$LD_LIBRARY_PATH"
          mkdir -p ../out
          cargo test --profile quick -p concat-speech --lib -- --ignored a_local_voice_is_heard_by_local_whisper --nocapture > ../out/voice.log 2>&1
          code=$?
          {
            echo '### Local text to speech, then local speech to text'
            echo "exit $code"
            echo '```'
            grep -E 'kokoro downloaded|spoke |said :|heard:|test result|panicked|whisper caught' ../out/voice.log | head -12
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: The built-in person model on a real photograph
        shell: bash
        working-directory: src
        run: |
          set +e
          mkdir -p ../out
          for url in \
            https://raw.githubusercontent.com/scikit-image/scikit-image/main/src/skimage/data/astronaut.png \
            https://raw.githubusercontent.com/scikit-image/scikit-image/v0.19.3/skimage/data/astronaut.png \
            https://raw.githubusercontent.com/scikit-image/scikit-image/v0.22.0/skimage/data/astronaut.png; do
            curl -fsSL -o ../out/astronaut.png "$url" && break
          done
          if [ ! -s ../out/astronaut.png ]; then
            pip install -q scikit-image && python3 -c "from skimage import data, io; io.imsave('../out/astronaut.png', data.astronaut())"
          fi
          ls -la ../out/astronaut.png
          size=$(identify -format '%wx%h' ../out/astronaut.png)
          convert ../out/astronaut.png -depth 8 rgba:../out/astronaut.rgba
          export LD_LIBRARY_PATH="$PWD/../stage/lib:$LD_LIBRARY_PATH"
          CONCAT_PERSON_RGBA="$PWD/../out/astronaut.rgba" CONCAT_PERSON_SIZE="$size" CONCAT_MASK_OUT="$PWD/../out/person-mask.png" \
            cargo test --profile quick -p concat-vision --features infer --lib -- --ignored the_built_in_model_finds_a_person --nocapture > ../out/person.log 2>&1
          code=$?
          {
            echo '### Local person cutout on a real photograph'
            echo "exit $code"
            echo '```'
            grep -E 'photo [0-9]|flat grey|test result|panicked|error' ../out/person.log | head -12
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit $code

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verify-desktop
          path: |
            out/*.png
            out/api.log
            out/whisper.log
            out/voice.log
            out/person.log
            out/person-mask.png
            out/astronaut.png
            out/hsl-before.png
            out/hsl-after.png
            out/hsl-red-after.png
            out/probes.log
            out/test.log
            out/drive-steps.log
            out/project-summary.txt
            out/drive.log
            out/editor.log
            out/window.log
            out/shots.mp4
            src/build.log
          if-no-files-found: ignore

  verify-windows:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      ORT_VERSION: 1.28.0
      GGML_NATIVE: "OFF"
      GGML_BACKEND_DL: "ON"
      GGML_CPU_ALL_VARIANTS: "ON"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The pinned toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' src/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (v1), 2026-10-09
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: FFmpeg development libraries and LLVM (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bash = "$env:ProgramFiles\Git\bin\bash.exe"
          & $bash scripts/ci/fetch.sh "llvm-win64" llvm.exe
          if ($LASTEXITCODE -ne 0) { throw "the LLVM download failed" }
          Start-Process -Wait -FilePath .\llvm.exe -ArgumentList "/S", "/D=C:\llvm"
          if (-not (Test-Path C:\llvm\bin\libclang.dll)) { throw "LLVM did not install to C:\llvm" }
          Remove-Item llvm.exe -ErrorAction SilentlyContinue
          "C:\llvm\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "LIBCLANG_PATH=C:\llvm\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          & $bash scripts/ci/fetch.sh "ffmpeg-win64" ffmpeg-win.zip
          if ($LASTEXITCODE -ne 0) { throw "the FFmpeg download failed" }
          Expand-Archive ffmpeg-win.zip -DestinationPath ffdl
          $dir = (Get-ChildItem ffdl -Directory | Select-Object -First 1).FullName
          "FFMPEG_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$dir\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: ONNX Runtime (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pip download "onnxruntime==$env:ORT_VERSION" --no-deps --only-binary=:all: `
            --platform win_amd64 --python-version 3.12 -d ort-wheel
          if ($LASTEXITCODE -ne 0) { throw "the ONNX Runtime wheel download failed" }
          $whl = Get-ChildItem ort-wheel\*.whl | Select-Object -First 1
          Expand-Archive $whl.FullName -DestinationPath ort-unpacked -Force
          $dir = "$PWD\onnxruntime-win-x64-$env:ORT_VERSION"
          New-Item -ItemType Directory -Force -Path "$dir\lib" | Out-Null
          $dll = Get-ChildItem ort-unpacked -Recurse -Filter "onnxruntime.dll" | Select-Object -First 1
          if (-not $dll) { throw "onnxruntime.dll not found in wheel" }
          Copy-Item $dll.FullName "$dir\lib\onnxruntime.dll"
          $lib = Get-ChildItem ort-unpacked -Recurse -Filter "onnxruntime.lib" | Select-Object -First 1
          if ($lib) {
            Copy-Item $lib.FullName "$dir\lib\onnxruntime.lib"
          } else {
            $dumpbin = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -find "VC\Tools\MSVC\**\bin\Host*\*\dumpbin.exe" | Select-Object -First 1
            if (-not $dumpbin) { throw "dumpbin.exe not found via vswhere" }
            $libExe = Join-Path (Split-Path $dumpbin) "lib.exe"
            if (-not (Test-Path $libExe)) { throw "lib.exe not found next to $dumpbin" }
            $exports = & $dumpbin /exports "$dir\lib\onnxruntime.dll" | ForEach-Object {
              if ($_ -match '^\s*\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)') { $Matches[1] }
            }
            @("LIBRARY onnxruntime", "EXPORTS") + $exports | Set-Content "$dir\lib\onnxruntime.def" -Encoding Ascii
            & $libExe /def:"$dir\lib\onnxruntime.def" /out:"$dir\lib\onnxruntime.lib" /machine:x64
            if ($LASTEXITCODE -ne 0) { throw "failed to generate onnxruntime.lib" }
          }
          "ORT_LIB_LOCATION=$dir\lib" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ORT_PREFER_DYNAMIC_LINK=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ORT_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$dir\lib" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: sherpa-onnx shared libraries (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Select-String -Path src\Cargo.lock -Pattern 'name = "sherpa-onnx-sys"' -Context 0,1).Context.PostContext[0] -replace '.*"(.*)".*', '$1'
          $name = "sherpa-onnx-win-x64-shared-MT-Release-lib"
          $stem = "sherpa-onnx-v$version-win-x64-shared-MT-Release-lib"
          $bash = "$env:ProgramFiles\Git\bin\bash.exe"
          & $bash scripts/ci/fetch.sh $name sherpa.tar.bz2
          if ($LASTEXITCODE -ne 0) { throw "the sherpa-onnx download failed" }
          python -c "import tarfile; t = tarfile.open('sherpa.tar.bz2'); t.extractall(**({'filter': 'data'} if hasattr(tarfile, 'data_filter') else {}))"
          New-Item -ItemType Directory -Force sherpa-libs, sherpa-dlls | Out-Null
          Copy-Item "$stem\lib\sherpa-onnx-*.lib" sherpa-libs\
          Copy-Item "$stem\lib\sherpa-onnx-*.dll" sherpa-dlls\
          "SHERPA_ONNX_LIB_DIR=$PWD\sherpa-libs" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SHERPA_DLL_DIR=$PWD\sherpa-dlls" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src
          key: verify-win-quick
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST GGML ORT

      - name: Build Windows concat and concat-cli (quick)
        shell: bash
        working-directory: src
        run: |
          set -o pipefail
          cargo build --profile quick -p concat 2>&1 | tee win-build.log
          cargo build --profile quick -p concat-cli --features pair 2>&1 | tee -a win-build.log

      - name: Stage and smoke-test Windows binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force out-win, out-win-test | Out-Null
          Copy-Item "src\target\quick\concat.exe" out-win\
          Copy-Item "src\target\quick\concat-cli.exe" out-win\
          Copy-Item "$env:FFMPEG_DIR\bin\*.dll" out-win\
          Copy-Item "$env:SHERPA_DLL_DIR\*.dll" out-win\
          Copy-Item "$env:ORT_DIR\lib\onnxruntime.dll" out-win\
          $built = Get-ChildItem "src\target\quick\build\whisper-rs-sys-*\out\bin\ggml-cpu-x64.dll" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($built) {
            Copy-Item "$($built.DirectoryName)\whisper.dll" out-win\ -ErrorAction SilentlyContinue
            Copy-Item "$($built.DirectoryName)\ggml*.dll" out-win\ -ErrorAction SilentlyContinue
          }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT" -Directory |
            Sort-Object FullName -Descending | Select-Object -First 1
          $dumpbin = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -find "VC\Tools\MSVC\**\bin\Host*\*\dumpbin.exe" | Select-Object -First 1
          if ($crt -and $dumpbin) {
            foreach ($pass in 1, 2) {
              foreach ($pe in Get-ChildItem out-win -File -Include *.exe, *.dll) {
                foreach ($line in & $dumpbin /nologo /dependents $pe.FullName) {
                  $dll = $line.Trim()
                  if ($dll -match "\.dll$" -and (Test-Path "$($crt.FullName)\$dll") -and -not (Test-Path "out-win\$dll")) {
                    Copy-Item "$($crt.FullName)\$dll" out-win\
                  }
                }
              }
            }
          }
          .\out-win\concat.exe --version
          .\out-win\concat.exe --smoke
          .\out-win\concat-cli.exe --version
          & "$env:FFMPEG_DIR\bin\ffmpeg.exe" -v error -y `
            -f lavfi -i "color=c=red:s=320x180:r=30:d=1.5" `
            -f lavfi -i "color=c=green:s=320x180:r=30:d=1.5" `
            -filter_complex "[0][1]concat=n=2:v=1:a=0" out-win-test\shots.mp4
          @'
          import json, os, subprocess
          cli = os.path.abspath("out-win/concat-cli.exe")
          work = os.path.abspath("out-win-test")
          proj = os.path.join(work, "proj")
          shots = os.path.join(work, "shots.mp4")
          export_mp4 = os.path.join(work, "win-export.mp4")
          proc = subprocess.Popen([cli, "api"], stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True, bufsize=1)
          def call(req):
              proc.stdin.write(json.dumps(req) + "\n")
              proc.stdin.flush()
              while True:
                  line = proc.stdout.readline()
                  if not line:
                      raise RuntimeError("api closed early")
                  msg = json.loads(line)
                  if "result" in msg or "error" in msg:
                      if msg.get("error"):
                          raise RuntimeError(f"{req['method']} error: {msg['error']}")
                      return msg.get("result", {})
          call({"method": "project.create", "location": work, "name": "proj"})
          call({"method": "media.import", "path": proj, "file": shots})
          added = call({"method": "edit.apply", "path": proj, "command": {"op": "addClipAtFirstFree", "mediaId": "m1", "start": 0}})
          cid = added.get("createdId") or "c3"
          call({"method": "edit.apply", "path": proj, "command": {"op": "updateClip", "clipId": cid, "patch": {"videoEffects": [{"id": "concat.hsl", "params": {"green_sat": -80.0}, "enabled": True}]}}})
